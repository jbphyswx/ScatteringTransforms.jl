name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 1.11 is the floor: Project.toml [workspace] and the test [sources] entry (used for the
        # unregistered NUFSHT.jl) require Julia >= 1.11. Add '1.10' back once those are registered.
        # '1' is intentionally omitted — it currently resolves to 1.12, duplicating that job; bump the
        # explicit list when a newer stable Julia is released.
        version: ['1.11', '1.12']
        os: [ubuntu-latest]
        arch: [x64]
        include:
          - version: 'nightly'
            os: ubuntu-latest
            arch: x64
    continue-on-error: ${{ matrix.version == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        # More than one thread, or every threaded-backend test silently runs on the serial path — and
        # so does the FFT library threading whose per-execution task spawns the allocation gates
        # exist to keep out of the cascades.
        env:
          JULIA_NUM_THREADS: '2'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate docs env
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'   # local package wired via [sources]
      # `make.jl` runs without `warnonly`, so a missing docstring, a dangling `@ref` or a module that
      # no longer exists fails here rather than silently shipping a broken reference.
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate examples env
        run: julia --project=examples -e 'using Pkg; Pkg.instantiate()'   # local package wired via [sources]
      - name: Execute example scripts
        run: |
          for f in examples/*.jl; do
            echo "::group::$f"
            julia --project=examples "$f"
            echo "::endgroup::"
          done
