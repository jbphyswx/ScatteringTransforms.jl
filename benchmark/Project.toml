# FINUFFT and NUFSHT are here because the nonuniform surfaces have no fast path without them: the
# `Auto` spectral backend resolves to the in-core O(M·K) reference, and the suite would report that
# as the transform's speed.
[sources]
ComputationalBackends = {url = "https://github.com/jbphyswx/ComputationalBackends.jl"}
NUFSHT = {url = "https://github.com/jbphyswx/NUFSHT.jl"}
ScatteringTransforms = {path = ".."}
SpectralBackends = {url = "https://github.com/jbphyswx/SpectralBackends.jl"}

[compat]
julia = "1.11"
